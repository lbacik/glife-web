# Tag -> image -> deploy. Push a v* tag to release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The gate: a tag whose suite is red never produces an image, so never deploys.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # REGISTRY_USER/REGISTRY_PASSWORD are environment secrets; a job that does not
    # name the environment sees them as empty strings. This also means any
    # deployment protection rule added to `prod` later gates the image build too.
    environment: prod
    env:
      IMAGE: ghcr.io/lbacik/glife-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile is single-stage, so there is no target to select.
          file: Dockerfile
          # rum is x86_64 (docker --context rum info); build only that.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          # No actions/attest-build-provenance: GitHub's attestation store rejects
          # writes from user-owned private repositories, and provenance/SBOM
          # already ride inside the image index in the registry.

  deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
