# Production stack, deployed by .github/workflows/deploy.yml with
# `docker compose --env-file /dev/null`, so every required ${VAR:?} below must
# be supplied by the deploy job (vars/secrets of the `prod` environment).
# The older docker-compose-prod.yml (build on the host from a git URL) is
# superseded by this file for tagged releases.
networks:
  default:
    external: true
    name: "${NETWORK:?NETWORK is required}"

services:
  web:
    image: "${APP_IMAGE:?APP_IMAGE is required}"
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: "${DOMAIN:?DOMAIN is required}"
      LETSENCRYPT_HOST: "${DOMAIN}"
      APP_ENV: prod
      APP_SECRET: "${APP_SECRET:?APP_SECRET is required}"
      APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
      JSONHUB_API: "${JSONHUB_API:-}"
      TEST_RESULT_V1_DEFINITION: "${TEST_RESULT_V1_DEFINITION:-}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
